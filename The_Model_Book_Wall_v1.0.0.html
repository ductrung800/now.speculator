bear","date":"Historical Bear Cycle","stats":{"studied":34,"referenced":14,"saved":22},"body":"A prolonged distribution-led bear market. The 2007 top was not a single blow-off; it developed through repeated failed attempts near the highs, deterioration in leadership, and heavier-volume breaks. The eventual March 2009 low is a useful study in how severe damage can precede a durable new bull cycle."},{"id":"covid-bear","category":"bear","type":"ticker","x":1538,"y":772,"rot":-2.4,"title":"COVID Crash","meta":"Feb 19, 2020 \u2192 Mar 23, 2020","stat":"\u221233.9%","sub":"33 days \u00b7 fastest bear on record","date":"Historical Bear Cycle","stats":{"studied":31,"referenced":16,"saved":21},"body":"The shortest bear market in the table and a textbook exhaustive selling-climax study. The decline compressed enormous damage into 33 calendar days, culminating in capitulation-style volume and a rapid reversal that was later confirmed by a new rally sequence."},{"id":"black-monday-bear","category":"bear","type":"ticker","x":1790,"y":128,"rot":-1.7,"title":"Black Monday","meta":"Aug 25, 1987 \u2192 Dec 4, 1987","stat":"\u221233.5%","sub":"101 days \u00b7 single-day \u221220.5% on Oct 19","date":"Historical Bear Cycle","stats":{"studied":28,"referenced":8,"saved":15},"body":"A fast climax-style break after an extended advance. Study the acceleration and extension into the 1987 top, then the violent transition from Stage 2 to Stage 4. It is a reminder that parabolic late-cycle behavior can reverse much faster than a distribution top."},{"id":"bear-2022","category":"bear","type":"ticker","x":515,"y":925,"rot":1.1,"title":"2022 Bear Market","meta":"Jan 3, 2022 \u2192 Oct 12, 2022","stat":"\u221225.4%","sub":"282 days \u00b7 grinding decline","date":"Historical Bear Cycle","stats":{"studied":24,"referenced":10,"saved":18},"body":"A useful extended dry-up case study: repeated rally attempts, repeated undercuts, and a long choppy decline rather than one final crash. This is the kind of environment where patience matters and multiple failed Follow-Through Days are normal before one finally sticks."},{"id":"90s-bull","category":"bull","type":"ticker","x":405,"y":72,"rot":1,"title":"\u201990s Secular Bull","meta":"Dec 4, 1987 \u2192 Mar 24, 2000","stat":"+582.1%","sub":"4,494 days \u00b7 largest gain in table","date":"Historical Bull Cycle","stats":{"studied":42,"referenced":17,"saved":24},"body":"The largest bull-market gain in the model-book table. The key study is not the final 582% figure; it is the long sequence of Stage 2 advances, corrections, leadership changes, and renewed breakouts that rewarded staying aligned with the primary trend."},{"id":"post-gfc-bull","category":"bull","type":"ticker","x":1570,"y":432,"rot":1.2,"title":"2009\u20132020 Bull Market","meta":"Mar 9, 2009 \u2192 Feb 19, 2020","stat":"+400.5%","sub":"3,999 days \u00b7 longest bull in table","date":"Historical Bull Cycle","stats":{"studied":36,"referenced":15,"saved":20},"body":"A decade-long bull market born after the Global Financial Crisis. Study the first months off the low: confirmation, expanding breadth, fresh leadership, and repeated successful pullbacks. Long bull markets contain many corrections without automatically becoming bear markets."},{"id":"covid-bull","category":"bull","type":"ticker","x":1980,"y":980,"rot":-1,"title":"2020\u20132022 Bull Market","meta":"Mar 23, 2020 \u2192 Jan 3, 2022","stat":"+114.4%","sub":"651 days \u00b7 rapid post-crash advance","date":"Historical Bull Cycle","stats":{"studied":27,"referenced":12,"saved":18},"body":"A fast new bull phase that followed the COVID selling climax. It is a strong example of why new leadership, expanding breadth, and a confirmed rally can matter more than the emotional memory of the preceding crash."},{"id":"climax-top-def","category":"tops","type":"chart","x":118,"y":257,"rot":-3,"title":"Climax Top","meta":"PATTERN \u00b7 TOPS","sketch":"climaxTop","date":"Model Rule","stats":{"studied":29,"referenced":7,"saved":16},"body":"Acceleration of the trend and visible extension above key moving averages just before distribution overtakes the market. Watch for a sharp increase in slope, roughly 15\u201325%+ extension above the 50-day moving average, and increasingly one-sided bullish sentiment. Historical examples in the book: August 1987, October 1929, January 1973."},{"id":"distribution-top-def","category":"tops","type":"chart","x":1320,"y":205,"rot":1.2,"title":"Distribution Top","meta":"PATTERN \u00b7 TOPS","sketch":"distributionTop","date":"Model Rule","stats":{"studied":33,"referenced":14,"saved":19},"body":"Multiple attempts at new highs get rejected while volume quietly favors down days. Watch for stalling near highs, 5+ distribution days in a rolling four-week window, and a weak rally attempt that fails on below-average volume before a heavier-volume breakdown. Historical examples: March 2000, October 2007, February 2020."},{"id":"climax-bottom-def","category":"bottoms","type":"chart","x":1790,"y":565,"rot":-1,"title":"Exhaustive Selling Climax","meta":"FRAMEWORK \u00b7 BOTTOMS","sketch":"climaxBottom","date":"Model Rule","stats":{"studied":26,"referenced":8,"saved":14},"body":"A huge spike in volume and wide downside price spread \u2014 capitulation. Watch for the largest down-volume day of the decline, a final undercut of a prior low on climactic volume, and an intraday recovery. Historical examples: March 2020, December 2018, February 2016, October 1987."},{"id":"dryup-bottom-def","category":"bottoms","type":"index","x":118,"y":555,"rot":-1.6,"title":"Extended Dry-Up Bottom","meta":"FRAMEWORK \u00b7 BOTTOMS","date":"Model Rule","stats":{"studied":25,"referenced":9,"saved":14},"body":"A grinding downtrend \u2014 failed rally attempts, repeated undercuts of prior lows, and numerous failed FTDs \u2014 until volume simply dries up. Watch for declining volume as price makes marginal new lows, multiple failed FTDs, and a long choppy stretch near the lows. Historical examples: 2022, 2011, 2001\u20132002, 1994."},{"id":"ftd-rule","category":"ftd","type":"index","x":662,"y":420,"rot":-1.7,"title":"Follow-Through Day Rule","meta":"RULE \u00b7 FOLLOW-THROUGH DAYS","date":"Pinned Aug 15, 2026","stats":{"studied":21,"referenced":9,"saved":17},"body":"Day 1 of a rally attempt: any day the index closes higher after making a new correction/bear-market low. Starting Day 4 (generally through about Day 7\u201310), watch for a session where the index gains 1.5%+ on volume higher than the prior session. That is the Follow-Through Day \u2014 evidence that demand has overwhelmed supply. Not every FTD works: use it as permission to test the long side in small size, not a green light to go all-in."},{"id":"power-trend-signature","category":"powertrend","type":"chart","x":660,"y":730,"rot":-2,"title":"Power Trend Signature","meta":"SKETCH \u00b7 POWER TRENDS","sketch":"powerTrend","date":"Model Rule","stats":{"studied":24,"referenced":9,"saved":15},"body":"An extended stretch where an index or leading stock trends higher while consistently holding above a short-term moving average, commonly the 21-day EMA. Pullbacks stay shallow, up-volume dominates, distribution remains rare, and the market spends most of its time in the healthiest sub-phase of Stage 2."},{"id":"bull-signposts","category":"powertrend","type":"index","x":1040,"y":330,"rot":-0.8,"title":"Bull Market Signposts","meta":"CHECKLIST \u00b7 FIRST 2 YEARS OFF A LOW","date":"Model Rule","stats":{"studied":23,"referenced":8,"saved":14},"body":"\u2022 Confirmed FTD within weeks of the low\n\u2022 New leadership \u2014 different names than the prior cycle\n\u2022 New-highs list expanding week over week\n\u2022 Distribution days staying low for extended stretches\n\u2022 Successful retests of the low that hold above the prior undercut level"},{"id":"new-leadership-checklist","category":"leadership","type":"index","x":115,"y":860,"rot":-0.7,"title":"New Leadership Checklist","meta":"FRAMEWORK \u00b7 LEADERSHIP","date":"Model Rule","stats":{"studied":25,"referenced":11,"saved":16},"body":"The stocks that lead off a bottom are rarely the prior cycle\u2019s leaders. Look for relative-strength new highs while the index is still below its own high; accumulation volume; accelerating EPS and sales; a tight, orderly base after the FTD; and confirmation from more than one stock in the same industry group."},{"id":"base-breakout-signature","category":"leadership","type":"chart","x":1080,"y":790,"rot":1.8,"title":"Base-and-Breakout Signature","meta":"SKETCH \u00b7 LEADERSHIP","sketch":"baseBreakout","date":"Model Rule","stats":{"studied":22,"referenced":10,"saved":15},"body":"Fresh leadership often appears as tight bases near highs while the index is still recovering. The highest-value clue is relative strength: leaders make new highs or sit close to them before the broad market fully confirms. Pair base quality with volume and group behavior rather than treating any breakout as sufficient."},{"id":"cycle-tracker","category":"journal","type":"index","x":1515,"y":1070,"rot":-2,"title":"Current Cycle Tracker","meta":"MY JOURNAL \u00b7 TEMPLATE","date":"Starter Journal","userCreated":true,"stats":{"studied":5,"referenced":0,"saved":0},"body":"Today\u2019s date:\nBull or bear market? (traffic-light filter):\nDays/weeks since last confirmed FTD:\nDistribution days in trailing 25 sessions:\n% off 52-week high (SPX / QQQ):\nNew highs vs. new lows:\nCurrent leadership (2\u20133 names):\nMy read: which Stage are we in?"},{"id":"ftd-log","category":"journal","type":"index","x":760,"y":1090,"rot":1,"title":"FTD Observation Log","meta":"MY JOURNAL \u00b7 TEMPLATE","date":"Starter Journal","userCreated":true,"stats":{"studied":4,"referenced":0,"saved":0},"body":"Date:\nIndex:\nDay # of rally attempt:\n% gain:\nVolume vs prior day:\nResult (worked / failed):\nWhat leadership appeared after the signal?"},{"id":"xpost-gdx-retail-flows-2026-08","category":"x-posts","collectionId":"x-posts","type":"reference","x":1490,"y":230,"rot":-1.0,"title":"GDX \u2014 Retail inflows accelerating","meta":"X POST \u00b7 FLOWS \u00b7 GOLD MINERS","date":"Pinned Aug 15, 2026","userCreated":true,"imageId":"seed-gdx-retail-flows","source":"The Kobeissi Letter","sourceUrl":"","tickers":"GDX","tags":"Gold Miners, Flows, Sentiment, Crowding","stats":{"studied":0,"referenced":0,"saved":1},"body":"Retail demand for gold-mining stocks accelerated sharply, with repeated inflows into GDX. Saved as a future reference for comparing retail crowding/enthusiasm with actual price, breadth, and leadership behavior."}],"CONNECTIONS":[["distribution-top-def","gfc-bear"],["climax-top-def","black-monday-bear"],["dryup-bottom-def","90s-bull"],["ftd-rule","post-gfc-bull"],["ftd-rule","covid-bull"],["power-trend-signature","90s-bull"],["new-leadership-checklist","90s-bull"],["climax-bottom-def","covid-bull"]],"DEFAULT_RECENTS":["xpost-gdx-retail-flows-2026-08","ftd-rule","gfc-bear","distribution-top-def"]}</script><script id="seed-image" type="text/plain">data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3oAAARjCAYAAAA5LValAAABYGlDQ1BJQ0MgUHJvZmlsZQAAKJF1kLFLQlEUxj/LMMx6DRUNEY+aKisxibYwoQiERJOs7fk0FfR1ee9FtDU1NEvQH1C0BEGDS0ND7ZFQ0CSNbRK8peR2rq96WnTgcH734zuXjwN0+BTGim4AJc3U4ytLcmpzS/a8ohsSvBjGpKIaLByLRcmC79le1iNcYlanxV+3vWMnp6mqdFmf8mWkwfpff1t5M1lDpflBHVSZbgKuAHFsz2SCD4gHdApFXBacs/lccNrm66ZnPR4hvifuV/NKhrhG7E+36LkWLhV31a8MIr0vqyUTNIeoRxDGGuJIIgEZy8QhLNAL/+yEmjsR7IBhHzoKyCEPk3bDpDAUkSVehQYVM/ATBxGgnhe3/n1DRzt8ABbLnPOao0UvgKsjoG/W0cY3KMoLcDfKFF35uazLchvbc0GbeypA1zHnb+T1TACNJ87fK5w3zoDOZ+DG+gTAMGZXzhNuqwAAAFZlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA5KGAAcAAAASAAAARKACAAQAAAABAAADeqADAAQAAAABAAAEYwAAAABBU0NJSQAAAFNjcmVlbnNob3S/Mwi2AAAB12lUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyIgeDp4bXB0az0iWE1QIENvcmUgNi4wLjAiPgogICA8cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPgogICAgICA8cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0iI (function(){
const DATA=JSON.parse(document.getElementById('wall-data').textContent);const DEFAULT_ENTRIES=JSON.parse(JSON.stringify(DATA.ENTRIES));const CORE_CATS=DATA.CATEGORIES.filter(c=>!['all','journal'].includes(c.id));const STORAGE='modelbook-v11-state';const PANE_STORAGE='modelbook-v11-panes';const DB_NAME='modelbook-v11-images';const DB_STORE='images';const seedDataUrl=document.getElementById('seed-image').textContent.trim();
let entries=JSON.parse(JSON.stringify(DEFAULT_ENTRIES)),collections=[{id:'x-posts',label:'X Posts'}],category='all',query='',selectedId=null,recentIds=(DATA.DEFAULT_RECENTS||['ftd-rule']).slice(),slotCursor=0,modal=null,editingId=null,pendingImages=[],contextMenu=null,boardZoom=1;
let studyDraft=null;let pendingStudyImages=new Map();
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const byId=id=>entries.find(e=>e.id===id);const nowLabel=()=>new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40)||('collection-'+Date.now());
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putImage(id,blob){const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}async function getImage(id){if(!id)return null;const db=await openDB();const out=await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const r=tx.objectStore(DB_STORE).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});db.close();return out}async function deleteImage(id){if(!id)return;const db=await openDB();await new Promise(res=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=res});db.close()}
function dataURLtoBlob(url){const [h,b]=url.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/png';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function seedImage(){try{if(!(await getImage('seed-gdx-retail-flows'))&&seedDataUrl)await putImage('seed-gdx-retail-flows',dataURLtoBlob(seedDataUrl))}catch(e){console.warn(e)}}
function applyState(s){if(!s)return;if(Array.isArray(s.entries))entries=s.entries;if(Array.isArray(s.collections))collections=s.collections;if(Array.isArray(s.recentIds))recentIds=s.recentIds;if(Number.isInteger(s.slotCursor))slotCursor=s.slotCursor;if(Number.isFinite(s.boardZoom))boardZoom=Math.max(.45,Math.min(1.8,s.boardZoom))}function load(){try{applyState(JSON.parse(localStorage.getItem(STORAGE)||'null'))}catch(e){console.warn('Model Book local state could not be read',e)}try{const p=JSON.parse(localStorage.getItem(PANE_STORAGE)||'null');if(p){document.documentElement.style.setProperty('--left-pane',p.left+'px');document.documentElement.style.setProperty('--right-pane',p.right+'px')}}catch(e){console.warn('Pane state could not be read',e)}}function compactState(){return {entries:entries.map(e=>{const c={...e};for(const k of ['imageData','imageUrl','dataUrl','attachmentData','attachment','thumbnailData','previewData']){if(typeof c[k]==='string'&&c[k].startsWith('data:'))delete c[k]}return c}),collections,recentIds,slotCursor,boardZoom}}function save(){const json=JSON.stringify(compactState());try{localStorage.setItem(STORAGE,json)}catch(e){if(e?.name==='QuotaExceededError')console.warn('LocalStorage quota reached; using IndexedDB fallback.');else console.warn('Model Book local save failed',e)}putImage('__modelbook_state__',new Blob([json],{type:'application/json'})).catch(err=>console.warn('IndexedDB state save failed',err))}async function hydrateSavedState(){try{const b=await getImage('__modelbook_state__');if(!b)return false;applyState(JSON.parse(await b.text()));return true}catch(e){console.warn('IndexedDB state restore failed',e);return false}}
function counts(){const c={all:entries.length,journal:entries.filter(e=>e.category==='journal').length};for(const e of entries)c[e.category]=(c[e.category]||0)+1;return c}function navItem(c,custom=false){const ct=counts()[c.id]||0;return `<div class="nav-item-row"><button class="nav-item ${category===c.id?'active':''}" data-cat="${esc(c.id)}"><span class="nav-dot"></span><span class="nav-name">${esc(c.label)}</span><span class="nav-count">${ct}</span></button>${custom?`<button class="collection-menu-btn" data-menu="${esc(c.id)}" aria-label="Collection options">⋯</button>`:''}</div>`}
function renderSidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">The Model<br>Book<span>.</span></div><div class="brand-tag">Build your visual memory.</div></div><div class="nav-group">${navItem({id:'all',label:'Wall'})}${navItem({id:'journal',label:'My Journal'})}</div><div class="nav-label-row"><span class="nav-label">MODEL LIBRARY</span></div><div>${CORE_CATS.map(c=>navItem(c)).join('')}</div><div class="nav-label-row"><span class="nav-label">MY COLLECTIONS</span><button class="collection-add" id="add-collection" title="New collection">+</button></div><div>${collections.map(c=>navItem(c,true)).join('')}</div><div class="sidebar-footer">“See it. Save it. Study it. Recognize it when it matters.”</div></aside>`}
function sketchColor(e){return ['bottoms','powertrend','leadership','bull'].includes(e.category)?'var(--bull)':'var(--bear)'}function excerpt(t,n=120){t=String(t||'').replace(/\n+/g,' ');return t.length>n?t.slice(0,n).trim()+'…':t}function cardWidth(e){return e.type==='reference'?255:236}function center(e){return{x:e.x+cardWidth(e)/2,y:e.y+30}}
function renderCard(e){const style=`left:${e.x}px;top:${e.y}px;transform:rotate(${e.rot||0}deg)`;let inner='';if(e.type==='reference')inner=`<div class="card-body"><div class="reference-thumb" data-image-target="${esc(entryImageIds(e)[0]||'')}">IMAGE</div><div class="card-eyebrow">${esc(e.meta)}</div><div class="card-title">${esc(e.title)}</div><div class="card-sub">${esc(e.source||e.tickers||'')}</div></div>`;else if(e.type==='ticker')inner=`<div class="card-body"><div class="card-eyebrow">${esc(e.meta)}</div><div class="card-stat">${esc(e.stat||'')}</div><div class="card-title">${esc(e.title)}</div><div class="card-sub">${esc(e.sub||'')}</div></div>`;else if(e.type==='chart')inner=`<div class="card-body"><svg viewBox="0 0 84 50"><path d="${esc(DATA.SKETCHES[e.sketch]||DATA.SKETCHES.powerTrend)}" fill="none" stroke="${sketchColor(e)}" stroke-width="2.4" stroke-linecap="round"/></svg><div class="card-eyebrow">${esc(e.meta)}</div><div class="card-title">${esc(e.title)}</div></div>`;else inner=`<div class="card-body"><div class="card-eyebrow">${esc(e.meta)}</div><div class="card-title">${esc(e.title)}</div><div class="card-excerpt">${esc(excerpt(e.body))}</div></div>`;const badge=studyCount(e)?`<span class="study-badge" title="${studyCount(e)} personal study items">${studyCount(e)}</span>`:'';return `<button class="card ${esc(e.type)}${e.id===selectedId?' selected':''}" style="${style}" data-id="${esc(e.id)}"><span class="pin"></span>${badge}${inner}</button>`}
function filtered(){const q=query.trim().toLowerCase();return entries.filter(e=>(category==='all'||e.category===category)&&(!q||`${e.title} ${e.body} ${e.meta} ${e.date} ${e.source||''} ${e.tickers||''} ${e.tags||''} ${studyNotesOf(e).map(n=>(n.text||'')+' '+(n.caption||'')+' '+(n.sourceUrl||'')).join(' ')}`.toLowerCase().includes(q)))}function renderConnections(ids){const paths=DATA.CONNECTIONS.map(([aId,bId])=>{const a=byId(aId),b=byId(bId);if(!a||!b||!ids.has(aId)||!ids.has(bId))return'';const p1=center(a),p2=center(b),mid=(p1.x+p2.x)/2,sag=26+Math.abs(p1.x-p2.x)*.04,bull=['bull','powertrend','leadership','bottoms','ftd'].includes(a.category)||['bull','powertrend'].includes(b.category);return `<path d="M ${p1.x} ${p1.y} Q ${mid} ${Math.max(p1.y,p2.y)+sag}, ${p2.x} ${p2.y}" fill="none" stroke="${bull?'var(--string-bull)':'var(--string-bear)'}" stroke-width="1.6"/>`}).join('');return `<svg class="connections" width="${DATA.BOARD_SIZE.width}" height="${DATA.BOARD_SIZE.height}">${paths}</svg>`}function renderBoard(){const v=filtered(),ids=new Set(v.map(e=>e.id)),sw=Math.round(DATA.BOARD_SIZE.width*boardZoom),sh=Math.round(DATA.BOARD_SIZE.height*boardZoom);return `<div class="board-scroll"><div class="board-stage" style="width:${sw}px;height:${sh}px"><div class="board" style="width:${DATA.BOARD_SIZE.width}px;height:${DATA.BOARD_SIZE.height}px;transform:scale(${boardZoom})">${renderConnections(ids)}${v.map(renderCard).join('')}</div></div></div>`}
function renderBottom(){const r=recentIds.map(byId).filter(Boolean).slice(0,5);return `<div class="bottom-bar"><span class="bottom-label">RECENTLY REVIEWED</span>${r.map(e=>`<button class="recent-item" data-open="${esc(e.id)}">${esc(e.title)}</button>`).join('')}<div class="bottom-spacer"></div><button class="backup-btn" id="backup">Backup</button><button class="add-btn" id="new-entry">+ New</button></div>`}

function studyNotesOf(e){return Array.isArray(e?.studyNotes)?e.studyNotes:[]}

function bindSplitter(el,side){if(!el)return;el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);el.classList.add('dragging');const move=e=>{if(side==='left'){const w=Math.max(150,Math.min(420,e.clientX));document.documentElement.style.setProperty('--left-pane',w+'px')}else{const w=Math.max(290,Math.min(720,window.innerWidth-e.clientX));document.documentElement.style.setProperty('--right-pane',w+'px')}};const up=()=>{el.classList.remove('dragging');el.removeEventListener('pointermove',move);const left=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--left-pane')),right=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--right-pane'));try{localStorage.setItem(PANE_STORAGE,JSON.stringify({left,right}))}catch(e){console.warn('Pane preference save failed',e)}};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up,{once:true})});el.addEventListener('dblclick',()=>{if(side==='left')document.documentElement.style.setProperty('--left-pane','220px');else document.documentElement.style.setProperty('--right-pane','390px')})}
function setBoardZoom(next,mode='center'){const scroller=root.querySelector('.board-scroll');const old=boardZoom;next=Math.max(.45,Math.min(1.8,Math.round(next*20)/20));if(Math.abs(next-old)<.001)return;if(scroller){const cx=scroller.scrollLeft+scroller.clientWidth/2,cy=scroller.scrollTop+scroller.clientHeight/2,worldX=cx/old,worldY=cy/old;boardZoom=next;const stage=scroller.querySelector('.board-stage'),board=scroller.querySelector('.board');if(stage){stage.style.width=Math.round(DATA.BOARD_SIZE.width*boardZoom)+'px';stage.style.height=Math.round(DATA.BOARD_SIZE.height*boardZoom)+'px'}if(board)board.style.transform=`scale(${boardZoom})`;const label=root.querySelector('#zoom-label');if(label)label.textContent=Math.round(boardZoom*100)+'%';if(mode==='center'){scroller.scrollLeft=worldX*boardZoom-scroller.clientWidth/2;scroller.scrollTop=worldY*boardZoom-scroller.clientHeight/2}}else boardZoom=next;save()}

function bindCardDrag(){root.querySelectorAll('.card').forEach(card=>{let active=false,moved=false,pid=null,startX=0,startY=0,startEntryX=0,startEntryY=0;const id=card.dataset.id;card.addEventListener('pointerdown',e=>{if(e.button!==0)return;const entry=byId(id);if(!entry)return;active=true;moved=false;pid=e.pointerId;startX=e.clientX;startY=e.clientY;startEntryX=entry.x;startEntryY=entry.y;card.setPointerCapture?.(pid);card.classList.add('card-drag-ready');e.stopPropagation()});card.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const dx=(e.clientX-startX)/boardZoom,dy=(e.clientY-startY)/boardZoom;if(!moved&&Math.hypot(dx,dy)>4){moved=true;card.classList.add('card-dragging')}if(!moved)return;const entry=byId(id);const maxX=DATA.BOARD_SIZE.width-cardWidth(entry),maxY=DATA.BOARD_SIZE.height-90;entry.x=Math.max(0,Math.min(maxX,startEntryX+dx));entry.y=Math.max(0,Math.min(maxY,startEntryY+dy));card.style.left=entry.x+'px';card.style.top=entry.y+'px';e.preventDefault();e.stopPropagation()});const finish=e=>{if(!active||(e&&e.pointerId!==pid))return;active=false;try{card.releasePointerCapture?.(pid)}catch(_){}card.classList.remove('card-drag-ready','card-dragging');pid=null;if(moved){card.dataset.suppressClick='1';save();const sc=root.querySelector('.board-scroll'),sx=sc?.scrollLeft||0,sy=sc?.scrollTop||0;const holder=root.querySelector('.board-stage');if(holder){const v=filtered(),ids=new Set(v.map(x=>x.id));holder.innerHTML=`<div class="board" style="width:${DATA.BOARD_SIZE.width}px;height:${DATA.BOARD_SIZE.height}px;transform:scale(${boardZoom})">${renderConnections(ids)}${v.map(renderCard).join('')}</div>`;if(sc){sc.scrollLeft=sx;sc.scrollTop=sy}bindCardDrag();hydrateImages()}}};card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);card.addEventListener('click',e=>{if(card.dataset.suppressClick==='1'){delete card.dataset.suppressClick;e.preventDefault();e.stopPropagation();return}openEntry(id)})})}
function bindBoardPan(){const scroller=root.querySelector('.board-scroll');if(!scroller)return;let active=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0,pid=null;const threshold=4;scroller.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(e.target.closest('.card,button,input,textarea,select,a'))return;active=true;moved=false;pid=e.pointerId;startX=e.clientX;startY=e.clientY;startLeft=scroller.scrollLeft;startTop=scroller.scrollTop;scroller.setPointerCapture?.(pid);scroller.classList.add('panning');e.preventDefault()});scroller.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>threshold||Math.abs(dy)>threshold)moved=true;scroller.scrollLeft=startLeft-dx;scroller.scrollTop=startTop-dy;e.preventDefault()});const end=e=>{if(!active||(e&&e.pointerId!==pid))return;active=false;scroller.classList.remove('panning');try{scroller.releasePointerCapture?.(pid)}catch(_){}pid=null};scroller.addEventListener('pointerup',end);scroller.addEventListener('pointercancel',end);scroller.addEventListener('lostpointercapture',()=>{active=false;scroller.classList.remove('panning');pid=null})}

function handleContext(action){const id=contextMenu.id,idx=collections.findIndex(c=>c.id===id);if(action==='rename'){modal='rename';render();return}if(action==='up'&&idx>0)[collections[idx-1],collections[idx]]=[collections[idx],collections[idx-1]];if(action==='down'&&idx<collections.length-1)[collections[idx+1],collections[idx]]=[collections[idx],collections[idx+1]];if(action==='delete'){const c=collections[idx];if(confirm(`Delete “${c.label}”? Its entries will be moved to My Journal.`)){entries=entries.map(e=>e.category===id?{...e,category:'journal',collectionId:null,meta:(e.meta||'').replace('X POST','REFERENCE')}:e);collections.splice(idx,1);if(category===id)category='journal'}}contextMenu=null;save();render()}
function clipboardImageFiles(ev){const out=[];const dt=ev.clipboardData;if(!dt)return out;for(const item of [...(dt.items||[])]){if(item.kind==='file'&&item.type&&item.type.startsWith('image/')){const f=item.getAsFile();if(f)out.push(f)}}if(!out.length){for(const f of [...(dt.files||[])])if(f.type&&f.type.startsWith('image/'))out.push(f)}return out}
function templateChange(){const t=templates.find(x=>x.id===root.querySelector('#m-template').value);const body=root.querySelector('#m-body');if(t&&body&&!body.value)body.value=t.body;const imageFields=root.querySelector('#image-fields');if(imageFields)imageFields.style.display=t?.type==='reference'?'':'none';if(t?.type==='reference'){const sel=root.querySelector('#m-collection');if(sel&&collections.some(c=>c.id==='x-posts'))sel.value='x-posts'}}
function setupDrop(){const dz=root.querySelector('#drop-zone'),fi=root.querySelector('#m-image');if(!dz||!fi)return;const existing=editingId?entryImageIds(byId(editingId)):[];const updateSummary=()=>{const el=root.querySelector('#attachment-summary');if(el)el.innerHTML=`${existing.length?`<b>${existing.length}</b> existing image${existing.length===1?'':'s'} preserved. `:''}${pendingImages.length?`<b>${pendingImages.length}</b> new image${pendingImages.length===1?'':'s'} will be added.`:'Paste or choose more images to append.'}`};const addFiles=files=>{for(const f of files||[]){if(f&&f.type&&f.type.startsWith('image/')){pendingImages.push(f);showPreview(f,f.name||'Pasted image')}}updateSummary();const imageFields=root.querySelector('#image-fields');if(imageFields)imageFields.style.display=''};fi.onchange=e=>{addFiles([...e.target.files]);fi.value=''};dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')};dz.ondragleave=()=>dz.classList.remove('drag');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');addFiles([...e.dataTransfer.files])};const body=root.querySelector('#m-body');if(body){body.addEventListener('paste',ev=>{const files=clipboardImageFiles(ev);if(!files.length)return;ev.preventDefault();addFiles(files);requestAnimationFrame(()=>body.focus())})}dz.addEventListener('paste',ev=>{const files=clipboardImageFiles(ev);if(!files.length)return;ev.preventDefault();addFiles(files)});updateSummary()}
function setupStudyPasteTargets(){const targets=root.querySelectorAll('[data-study-text],[data-study-caption]');for(const target of targets){target.addEventListener('paste',ev=>{const files=clipboardImageFiles(ev);if(!files.length)return;ev.preventDefault();syncStudyDraftFromDOM();for(const f of files)addStudyImageDraft(f,f.name||'Pasted image')})}const form=root.querySelector('#study-form');if(form){form.addEventListener('paste',ev=>{if(ev.target.closest('[data-study-text],[data-study-caption]'))return;const files=clipboardImageFiles(ev);if(!files.length)return;ev.preventDefault();syncStudyDraftFromDOM();for(const f of files)addStudyImageDraft(f,f.name||'Pasted image')})}}
function showPreview(blob,name){const list=root.querySelector('#image-preview-list');if(!list)return;const u=URL.createObjectURL(blob),row=document.createElement('div');row.className='image-preview-item';const img=document.createElement('img');img.src=u;img.onload=()=>URL.revokeObjectURL(u);const small=document.createElement('small');small.textContent=(name||blob.name||'Pasted image')+' · new attachment';row.append(img,small);list.appendChild(row)}
async function saveEntry(ev){ev.preventDefault();const title=root.querySelector('#m-title').value.trim(),body=root.querySelector('#m-body').value.trim();if(!title)return;if(editingId){const e=byId(editingId);e.title=title;e.body=body;e.source=root.querySelector('#m-source')?.value.trim()||e.source;e.tickers=root.querySelector('#m-tickers')?.value.trim()||'';e.tags=root.querySelector('#m-tags')?.value.trim()||'';const ids=entryImageIds(e);for(const blob of pendingImages){const id='img-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);await putImage(id,blob);ids.push(id)}if(ids.length){e.imageIds=ids;e.imageId=ids[0]}selectedId=e.id;modal=null;editingId=null;pendingImages=[];save();render();return}const t=templates.find(x=>x.id===root.querySelector('#m-template').value)||templates[0],cat=root.querySelector('#m-collection').value,slot=DATA.OPEN_SLOTS[slotCursor%DATA.OPEN_SLOTS.length],id='entry-'+Date.now();const imageIds=[];if(t.type==='reference')for(const blob of pendingImages){const iid='img-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);await putImage(iid,blob);imageIds.push(iid)}const e={id,category:cat,collectionId:cat==='journal'?null:cat,type:t.type,x:slot.x,y:slot.y,rot:slot.rot,title,meta:t.type==='reference'?`${categoryLabel(cat).toUpperCase()} · REFERENCE`:t.meta,date:`Pinned ${nowLabel()}`,userCreated:true,imageId:imageIds[0]||null,imageIds,source:root.querySelector('#m-source')?.value.trim()||'',tickers:root.querySelector('#m-tickers')?.value.trim()||'',tags:root.querySelector('#m-tags')?.value.trim()||'',stats:{studied:0,referenced:0,saved:0},body:body||t.body||'No notes yet.',stat:t.type==='ticker'?'—':undefined,sub:t.type==='ticker'?'Fill in the numbers when you review this.':undefined,sketch:t.type==='chart'?'powerTrend':undefined};entries.push(e);slotCursor++;category=cat;selectedId=id;recentIds=[id,...recentIds].slice(0,8);modal=null;pendingImages=[];save();render()}
async function deleteSelected(){const e=byId(selectedId);if(!e?.userCreated)return;if(!confirm(`Delete “${e.title}”?`))return;for(const id of entryImageIds(e))await deleteImage(id);entries=entries.filter(x=>x.id!==e.id);recentIds=recentIds.filter(x=>x!==e.id);selectedId=null;save();render()}function saveToJournal(){const s=byId(selectedId);if(!s)return;const slot=DATA.OPEN_SLOTS[slotCursor%DATA.OPEN_SLOTS.length],id='journal-'+Date.now();entries.push({id,category:'journal',type:'index',x:slot.x,y:slot.y,rot:slot.rot,title:`Study — ${s.title}`,meta:'SAVED STUDY · MY JOURNAL',date:`Pinned ${nowLabel()}`,userCreated:true,referenceSourceId:s.id,stats:{studied:0,referenced:0,saved:0},body:`Source model: ${s.title}\n\nWhy it matters to me:\n\nWhat would I recognize live next time?\n\nOriginal note:\n${s.body}`});slotCursor++;category='journal';selectedId=id;save();render()}
async function blobToDataURL(b){return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}async function exportBackup(){const imageIds=[...new Set(entries.flatMap(e=>[...entryImageIds(e),...studyNotesOf(e).filter(n=>n.type==='image').map(n=>n.imageId)].filter(Boolean)))],images={};for(const id of imageIds){const b=await getImage(id);if(b)images[id]=await blobToDataURL(b)}const payload={version:1.17,exportedAt:new Date().toISOString(),entries,collections,recentIds,slotCursor,images};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='The_Model_Book_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(file){if(!file)return;try{const p=JSON.parse(await file.text());if(!Array.isArray(p.entries))throw new Error('Invalid backup');entries=p.entries;collections=Array.isArray(p.collections)?p.collections:collections;recentIds=p.recentIds||[];slotCursor=p.slotCursor||0;if(p.images)for(const [id,url] of Object.entries(p.images))await putImage(id,dataURLtoBlob(url));selectedId=null;category='all';modal=null;save();render()}catch(e){alert('Could not import: '+e.message)}}async function resetDefaults(){if(!confirm('Reset entries, collections, study notes, study stats and images to defaults?'))return;entries=JSON.parse(JSON.stringify(DEFAULT_ENTRIES));collections=[{id:'x-posts',label:'X Posts'}];recentIds=(DATA.DEFAULT_RECENTS||[]).slice();slotCursor=0;selectedId=null;category='all';localStorage.removeItem(STORAGE);await deleteImage('__modelbook_state__');await seedImage();save();modal=null;render()}
